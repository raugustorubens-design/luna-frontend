name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Constitution check
        run: pnpm run test:constitution

      - name: Tests
        run: pnpm run test

      # "pnpm run lint" deliberadamente fora deste workflow: ENG-032 já
      # registrou que o ESLint deste repositório tem setup interativo
      # (pede configuração na primeira execução) e trava em ambiente não
      # interativo como o de um runner de CI. Precisa ser corrigido
      # separadamente (gerar o arquivo de config do ESLint com resposta
      # não-interativa, uma vez, e commitar) antes de incluir lint aqui —
      # não fiz essa correção agora para não misturar dois escopos.
